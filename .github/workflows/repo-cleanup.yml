name: Repository cleanup
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove old platform bindings
        shell: bash
        run: |
          set -euo pipefail
          rm -f hatchable.toml
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          text_ext = {'.html','.js','.css','.json','.md','.xml','.txt','.yml','.yaml','.toml'}
          patterns = [
              re.compile(r'<script>window\.__HATCHABLE__.*?</script>', re.I | re.S),
              re.compile(r'<script src="/__hatchable/[^>]+></script>', re.I),
              re.compile(r'<!--[^>]*Hatchable[^>]*-->', re.I),
              re.compile(r'<a[^>]+id=["\']hb-badge["\'][\s\S]*?</a>', re.I),
          ]
          for path in root.rglob('*'):
              if '.git' in path.parts or '.github' in path.parts:
                  continue
              if not path.is_file() or path.suffix.lower() not in text_ext:
                  continue
              try:
                  s = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = s
              for p in patterns:
                  s = p.sub('', s)
              s = s.replace('https://haxbro.hatchable.site', '')
              if s != original:
                  path.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove legacy platform bindings'
          git push
