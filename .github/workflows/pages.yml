name: Deploy HAxBRO AI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R public/. _site/
          if [ -f public/app/index.html ]; then cp public/app/index.html _site/index.html; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          # Remove Hatchable-only bootstrap and badge from the independent Pages build.
          s=re.sub(r'<script>window\\.__HATCHABLE__.*?</script>','',s,flags=re.S)
          s=re.sub(r'<script src="/__hatchable/[^\"]+"[^>]*></script>','',s)
          s=re.sub(r'<a id="hb-badge".*?</a>','',s,flags=re.S)
          s=re.sub(r'<script>\(async\(\)=>\{try\{const r=await fetch\(\'/api/session\'.*?</script>','',s,flags=re.S)
          # Source app uses root-absolute static assets. Prefix them for project Pages.
          s=s.replace('src="/','src="/haxbro-ai/')
          s=s.replace('href="/','href="/haxbro-ai/')
          s=s.replace('src="/haxbro-ai/__hatchable/','src="/__hatchable/')
          # Independent workspace layer.
          s=s.replace('</head>','<link rel="stylesheet" href="/haxbro-ai/workspace-overhaul.css?v=1"><script src="/haxbro-ai/workspace-overhaul.js?v=1" defer></script></head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
