[ai]
required = true
providers = ["openai", "google"]
description = "HAxBRO Kai multi-provider failover: OpenAI, Google Gemini, Groq, Cerebras, Mistral, OpenRouter, and Cloudflare Workers AI"

[[secret]]
name = "OPENAI_API_KEY"
required = false
expose = true
description = "OpenAI API key for HAxBRO primary AI provider"

[[secret]]
name = "GOOGLE_API_KEY"
required = false
expose = true
description = "Google Gemini API key for HAxBRO secondary AI provider"

[[secret]]
name = "PORT"
required = false
expose = true
description = "Optional application port override"

[[secret]]
name = "GROQ_API_KEY"
required = false
expose = true
description = "Optional Groq API key for tertiary AI fallback"

[[secret]]
name = "CEREBRAS_API_KEY"
required = false
expose = true
description = "Optional Cerebras API key for fourth AI fallback"

[[secret]]
name = "ANTHROPIC_API_KEY"
required = false
expose = true
description = "Optional Anthropic API key; disabled in Kai's free-first routing"

[[secret]]
name = "MISTRAL_API_KEY"
required = false
expose = true
description = "Optional Mistral API key for Kai fallback"

[[secret]]
name = "OPENROUTER_API_KEY"
required = false
expose = true
description = "Optional OpenRouter API key for free-model fallback routing"

[[secret]]
name = "CLOUDFLARE_API_TOKEN"
required = false
expose = true
description = "Optional Cloudflare API token for Workers AI fallback"

[[secret]]
name = "CLOUDFLARE_ACCOUNT_ID"
required = false
expose = true
description = "Optional Cloudflare account ID for Workers AI fallback"