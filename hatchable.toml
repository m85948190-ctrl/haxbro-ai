[ai]
required = true
providers = ["openai", "google"]
description = "HAxBRO AI chat with Kai failover: OpenAI primary, Google secondary, Groq tertiary, Cerebras fourth"

[[secret]]
name = "OPENAI_API_KEY"
required = false
expose = true
description = "OpenAI API key for HAxBRO primary AI provider"

[[secret]]
name = "GOOGLE_API_KEY"
required = false
expose = true
description = "Google Gemini API key for HAxBRO secondary AI provider"

[[secret]]
name = "PORT"
required = false
expose = true
description = "Optional application port override"

[[secret]]
name = "GROQ_API_KEY"
required = false
expose = true
description = "Optional Groq API key for tertiary AI fallback"

[[secret]]
name = "CEREBRAS_API_KEY"
required = false
expose = true
description = "Optional Cerebras API key for fourth AI fallback"

[[secret]]
name = "ANTHROPIC_API_KEY"
required = false
expose = true
description = "Optional Anthropic API key for tertiary AI fallback"