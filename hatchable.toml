[ai]
required = true
providers = ["openai", "google"]
description = "HAxBRO Kai free-first multi-provider failover: OpenAI, Google Gemini, Groq, Mistral, OpenRouter, and Hugging Face"

[[secret]]
name = "OPENAI_API_KEY"
required = false
expose = true
description = "OpenAI API key for HAxBRO primary AI provider"

[[secret]]
name = "GOOGLE_API_KEY"
required = false
expose = true
description = "Google Gemini API key for HAxBRO secondary AI provider"

[[secret]]
name = "GROQ_API_KEY"
required = false
expose = true
description = "Optional Groq API key for Kai fallback"

[[secret]]
name = "MISTRAL_API_KEY"
required = false
expose = true
description = "Optional Mistral API key for Kai fallback"

[[secret]]
name = "OPENROUTER_API_KEY"
required = false
expose = true
description = "Optional OpenRouter API key for Kai free-model fallback"

[[secret]]
name = "HF_TOKEN"
required = false
expose = true
description = "Optional Hugging Face token for Kai model fallback"

[[secret]]
name = "VERCEL_TOKEN_1"
required = false
expose = true
description = "Vercel token 1 used server-side by HAxBRO to publish generated apps"

[[secret]]
name = "VERCEL_TOKEN_2"
required = false
expose = true
description = "Vercel token 2 used server-side by HAxBRO to publish generated apps"

[[secret]]
name = "SUPABASE_SERVICE_ROLE_KEY"
required = false
expose = true
description = "Supabase service-role key used only server-side for the HAxBRO knowledge bridge"

[[secret]]
name = "SUPABASE_URL"
required = false
expose = true
description = "Supabase project URL for the HAxBRO knowledge warehouse"

[[secret]]
name = "HAXBRO_INGEST_KEY"
required = true
expose = true
description = "Dedicated HAxBRO ingestion key for external research agents; never share the Supabase service-role key"