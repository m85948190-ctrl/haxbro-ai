<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAxBRO App Maker</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="brand"><span class="brandmark">HB</span><div><strong>HAx<span>BRO</span></strong><small>AI APP MAKER</small></div></div><a class="ghost" href="/">← HAxBRO</a></header><main class="maker"><div class="maker-card"><div class="section-label">APP MAKER BY PROMPT</div><h1>Build an app with AI.</h1><p>Describe your app, features, design, and target users. HAxBRO will turn your idea into a structured build plan and starter implementation.</p><textarea id="idea" placeholder="Example: Build a modern expense tracker for students with charts, categories, and dark mode..."></textarea><button id="build" class="send">GENERATE APP PLAN →</button><div id="result" class="maker-result"></div><div class="credit">Made by <b>Mainak Kuila</b></div></div></main><script>const idea=document.querySelector('#idea'),result=document.querySelector('#result');document.querySelector('#build').onclick=async()=>{if(!idea.value.trim())return;result.textContent='Designing your app…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'normal',prompt:'You are HAxBRO App Maker. Create a practical app blueprint from this user prompt. Return: APP CONCEPT, FEATURES, PAGES, DATA MODEL, API PLAN, UI STYLE, BUILD STEPS. Be concise but useful. User prompt:\n'+idea.value})});const d=await r.json();result.textContent=d.response||d.error||'Unable to generate plan.'}catch(e){result.textContent='Connection error. Please try again.'}}</script></body></html>
