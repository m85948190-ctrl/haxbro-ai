<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a0d"><title>HAxBRO · App Maker</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="brand"><span class="brandmark">HB</span><div><strong>HAx<span>BRO</span></strong><small>APP MAKER</small></div></div><div class="top-center"><span class="eyebrow">BUILD WORKSPACE</span><span class="tagline">Turn an idea into a working project.</span></div><a class="ghost" href="/">← HAxBRO</a></header><main class="maker"><div class="maker-card"><div class="section-label">APP MAKER</div><h1>Build something<br><span style="color:#78d7b6">real.</span></h1><p>Describe what you want to create. HAxBRO will turn the request into a practical build specification.</p><textarea id="idea" placeholder="Describe your app..."></textarea><button id="build" class="send" style="height:46px;padding:0 22px">GENERATE →</button><div id="result" class="maker-result"></div><div class="credit">Made by <b>Mainak Kuila</b></div></div></main><script>const idea=document.querySelector('#idea'),result=document.querySelector('#result');document.querySelector('#build').onclick=async()=>{if(!idea.value.trim())return;result.textContent='Building your specification…';try{const r=await fetch('/api/app-maker',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea:idea.value})});const d=await r.json();result.textContent=d.response||d.error||'Unable to generate.'}catch(e){result.textContent='Connection error. Please try again.'}}</script></body></html>
